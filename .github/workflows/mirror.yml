# ハッカソン用リポジトリへのミラーの起動役。CI が green になったら tailnet に入って VPS へ
# SSH し、あとは向こうの mirror-sync に任せる（push も PR もマージも VPS の gh ログインで行う）。
# 必要な secret とセットアップ手順は README「ミラー」を参照。
name: Mirror to hackathon repo

on:
  # push を直接拾わず、CI が green で終わった実行だけを拾う（壊れたコミットを送らない）。
  # workflow_run はデフォルトブランチにあるファイルしか起動しないので、このワークフローは
  # main にも入れておく必要がある。
  workflow_run:
    workflows: [CI]
    types: [completed]
  # 手動実行（CI が走らないブランチや、取りこぼしの回収用）。
  workflow_dispatch:

# VPS 側の作業リポジトリは 1 つなので、ref をまたいで常に 1 本だけ流す。
concurrency:
  group: mirror
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mirror:
    name: Trigger mirror on the VPS
    # 自己ループ防止と、「push 由来で success だった CI」に限定する条件。
    if: >-
      github.repository_owner != 'NxTEND-THE-HACK'
      && (github.event_name == 'workflow_dispatch'
          || (github.event.workflow_run.event == 'push'
              && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env:
          TS_CLIENT: ${{ secrets.TS_CLIENT }}
          TS_SECRET: ${{ secrets.TS_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -eu
          missing=''
          for name in TS_CLIENT TS_SECRET SSH_HOST SSH_USER SSH_KEY; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::secret が未設定です:${missing}（mirror.yml 冒頭のセットアップ手順を参照）"
            exit 1
          fi

      # ephemeral ノードとして参加する（ジョブ終了後に自動で消える）。
      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_CLIENT }}
          oauth-secret: ${{ secrets.TS_SECRET }}
          tags: ${{ vars.TS_TAG || 'tag:ci' }}

      - name: Run mirror-sync over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/mirror_ci
          chmod 600 ~/.ssh/mirror_ci
          if [ -n "${KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS が未設定です。ホスト鍵を検証せずに接続します。"
            ssh-keyscan -T 30 "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

          # CI が通ったブランチだけを同期する。手動実行のときは引数なし = 全ブランチ + 全タグ。
          if [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
            args=''
          else
            # 引数はリモートのシェルが解釈するので、素直な ref 名以外は弾く。
            case "${BRANCH:-}" in
              '' | *[!A-Za-z0-9._/-]*)
                echo "::error::ブランチ名 '${BRANCH:-}' を渡せません。VPS で手動同期してください。"
                exit 1
                ;;
            esac
            args="${BRANCH}"
          fi

          # mirror-sync は ~/.local/bin にあるのでログインシェルで起動する。
          ssh -i ~/.ssh/mirror_ci \
            -o BatchMode=yes -o ConnectTimeout=30 -o IdentitiesOnly=yes \
            "${SSH_USER}@${SSH_HOST}" "bash -lc 'mirror-sync ${args}'"
